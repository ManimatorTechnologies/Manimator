<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
  <!ENTITY ns_svg "http://www.w3.org/2000/svg">
]>
<svg xmlns="&ns_svg;" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" fill="#333" stroke-width="2">
  <style type="text/css"><![CDATA[
    .a { fill: #FC6255; stroke: #fff }
    rect.b, .c { fill: green; stroke-width: 4 }
    /* comment */
  ]]></style>
  <defs>
    <path id="tri" d="M0 0 L20 0 L10 15 Z"/>
    <g id="pair"><circle cx="0" cy="0" r="5" class="a"/><rect x="10" y="-5" width="10" height="10" class="b"/></g>
  </defs>
  <inkscape:namedview id="nv"/>
  <g transform="translate(50 50) rotate(30)">
    <use xlink:href="#tri" x="10" y="20" fill="blue"/>
    <use href="#pair" transform="scale(2)"/>
    <g transform="matrix(1 0.2 -0.3 1 5 6)" style="fill:currentColor;color:#123456">
      <polygon points="0,0 30,0 15,25"/>
      <polyline points="40,0 50,20 60,0 70,20" fill="none" stroke="#abc"/>
    </g>
  </g>
  <g display="none"><rect width="100" height="100"/></g>
  <rect x="100" y="100" width="40" height="20" class="c" rx="5"/>
  <rect x="150" y="100" width="40" height="20" rx="3" ry="8" transform="rotate(20 170 110)" stroke="black"/>
  <rect x="200" y="100" width="40" height="20" transform="scale(-1 1)" fill="teal"/>
  <ellipse cx="60" cy="150" rx="30" ry="10" transform="skewX(15)" fill="rgb(200, 100, 50)"/>
  <circle cx="120" cy="150" r="12" transform="translate(5,5) scale(1.5)" fill="hsl(120, 50%, 50%)" stroke="rgba(255,0,0,0.5)"/>
  <line x1="0" y1="190" x2="100" y2="170" stroke="#123456" stroke-width="1.5pt"/>
</svg>
