<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Code test</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-rows: 44px 1fr; background: #1b1b1f; color: #ddd;
      font: 13px system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #333; }
    header .grow { flex: 1; }
    button { background: #2c2c33; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    main { display: grid; grid-template-columns: 180px 1fr 1fr; min-height: 0; }
    #files { border-right: 1px solid #333; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    #files .f { padding: 3px 6px; border-radius: 4px; font-family: monospace; }
    #files .f.on { background: #2c2c33; }
    #drop { margin-top: auto; border: 1px dashed #555; border-radius: 6px; padding: 10px; text-align: center; color: #999; }
    #code { width: 100%; height: 100%; resize: none; border: 0; border-right: 1px solid #333; background: #16161a;
      color: #e6e6e6; font: 13px/1.5 Consolas, monospace; padding: 10px; tab-size: 4; outline: none; }
    #right { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
    #screen { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #333; }
    #bar input { flex: 1; }
    #console { margin: 0; padding: 8px; overflow: auto; font: 12px/1.45 Consolas, monospace; white-space: pre-wrap; }
    #console .err { color: #ff8080; }
    #console .info { color: #8aa; }
  </style>
</head>
<body>
  <header>
    <strong>Manimator</strong><span class="grow"></span>
    <span id="status">Loading Python…</span>
    <button id="run" disabled>Run ▶ (Ctrl+Enter)</button>
  </header>
  <main>
    <div id="files">
      <div class="f on">scene.py</div>
      <div id="drop">Drop data files here<br><button id="upload">Upload</button><input id="pick" type="file" multiple hidden></div>
    </div>
    <textarea id="code" spellcheck="false"></textarea>
    <div id="right">
      <canvas id="screen" width="854" height="480"></canvas>
      <div id="bar"><button id="play">▶</button><input id="scrub" type="range" min="0" max="0" value="0"><span id="time">0.0 s</span></div>
      <pre id="console"></pre>
    </div>
  </main>
  <script type="module" src="code.js"></script>
</body>
</html>
