<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCP host (dev)</title>
<!-- Dev only: plays the part of an AI chat showing the MCP App (manimator/server/mcp.py). It reads the player page
     from /mcp, runs it in a sandboxed frame with an opaque origin and the CSP its resource asks for (as a chat's
     sandbox does), and talks MCP Apps to it: initialize, tool input, then the ShowAnimation result.
     Serve this folder from another origin (launch config "mcp-host": python -m http.server 8022), so the
     player loads the engine cross-origin as it does in a chat:
     http://localhost:8022/mcp_host.html?mcp=http://localhost:8021/mcp&scene=<name>&theme=light|dark&width=<px>
     ?result=<url of a saved tool result (JSON)> plays that instead of calling ShowAnimation (scenes with
     customizations come from the User MCP, which needs a sign-in); ?noframes=1 plays a chat that ignores the
     resource's frameDomains (no nested frames). -->
<style>
  body { margin: 0; padding: 24px; background: #262624; color: #c3c2b7; font: 14px system-ui, sans-serif; }
  body.light { background: #faf9f5; color: #1f1e1d; }
  .chat { max-width: var(--w, 720px); margin: 0 auto; }
  iframe { display: block; width: 100%; border: 0; height: 200px; }
  .full iframe { position: fixed; inset: 0; width: 100vw; height: 100vh !important; background: inherit; z-index: 5; }
  pre { white-space: pre-wrap; font-size: 12px; opacity: .8; }
</style>
</head>
<body>
<div class="chat">
  <p>Here is an animation:</p>
  <!-- As a chat's sandbox proxy does (its own origin, scripts allowed). A fully opaque frame can't reach
       localhost at all in Chromium (local network protection), which a real, public site never runs into. -->
  <iframe sandbox="allow-scripts allow-same-origin" title="Manimator"></iframe>
  <pre class="log"></pre>
</div>
<script type="module">
const q = new URLSearchParams(location.search);
const theme = q.get("theme") || "dark";
document.body.classList.toggle("light", theme === "light");
document.documentElement.style.colorScheme = theme; // as Claude's page does: the frame must match it
if (q.get("width")) document.querySelector(".chat").style.setProperty("--w", `${q.get("width")}px`);
const frame = document.querySelector("iframe");
const logBox = document.querySelector(".log");
const log = (...a) => { logBox.textContent += a.map((x) => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n"; };
window.mcpLog = [];

const MCP = q.get("mcp") || "http://localhost:8021/mcp";
let rpcId = 0;
async function rpc(method, params = {}) {
  const res = await fetch(MCP, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params }) });
  const body = await res.json();
  if (body.error) throw new Error(body.error.message);
  return body.result;
}

const SCENES = {
  pythagoras: null, // the guide's own example
  derivative: {
    text: String.raw`### The derivative as a slope

The **derivative** of $f$ at a point is the slope of the curve there: how fast $f(x)$ changes as $x$ moves. For $f(x) = \tfrac{1}{4}x^2 - 1$,

$$f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h} = \tfrac{1}{2}x.$$

- Left of the bottom the slope is *negative*,
- at $x = 0$ it is zero,
- and to the right it grows with $x$.

Watch the dot ride the curve: ` + "`f'`" + ` is the steepness under it.`,
    title: "The derivative as a slope",
    objects: [
      { name: "title", type: "Text", params: { text: "Slope of a curve", font_size: 40 }, methods: [{ method: "to_edge", args: { edge: "UP" } }] },
      { name: "axes", type: "Axes", params: { x_range: [-4, 4, 1], y_range: [-2, 2, 1], x_length: 8, y_length: 4, tips: false }, position: [0, -0.5] },
      { name: "curve", type: "FunctionGraph", params: { expr: "0.25*x^2 - 1.5", x_range: [-3.4, 3.4, 0.05] }, style: { color: "BLUE" } },
      { name: "dot", type: "Dot", position: [-3.4, 1.39], style: { color: "YELLOW" } },
      { name: "f", type: "MathTex", params: { tex: "f(x) = \\tfrac{1}{4}x^2 - 1", font_size: 40 }, position: [3.6, 2.2], style: { color: "BLUE" } },
      { name: "d", type: "MathTex", params: { tex: "f'(x) = \\tfrac{1}{2}x", font_size: 40 }, position: [3.6, 2.2], style: { color: "YELLOW" } },
      { name: "box", type: "SurroundingRectangle", params: { mobject: "d", buff: 0.15 } },
    ],
    steps: [
      { play: [{ anim: "Write", target: "title" }] },
      { play: [{ anim: "Create", target: "axes" }, { anim: "Create", target: "curve" }], run_time: 2, lag_ratio: 0.3 },
      { play: [{ anim: "Write", target: "f" }] },
      { play: [{ anim: "FadeIn", target: "dot", params: { scale: 0.5 } }] },
      { play: [{ anim: "MoveAlongPath", target: "dot", params: { path: "curve" } }], run_time: 3, rate_func: "linear" },
      { play: [{ anim: "ReplacementTransform", target: "f", params: { target_mobject: "d" } }] },
      { play: [{ anim: "Create", target: "box" }] },
      { wait: 1.5 },
    ],
  },
  // the same passage as a screenshot of Claude's own answer text, to compare fonts
  godel: {
    text: String.raw`### What it does and doesn’t mean

- It doesn’t say that “some things are unknowable” or that logic is broken. It says that no single fixed, algorithmic set of axioms captures *all* arithmetical truth.
- G is only unprovable *in F*. You can add G as a new axiom, but then the new system has its own Gödel sentence, and the pattern repeats.
- Hilbert’s program, which hoped to prove all of mathematics consistent by finite methods, could not succeed as originally stated.`,
    title: "Incompleteness",
    objects: [{ name: "t", type: "MathTex", params: { tex: "F \\nvdash G", font_size: 72 } }],
    steps: [{ play: [{ anim: "Write", target: "t" }] }],
  },
  broken: { objects: [{ name: "c", type: "Circel" }], steps: [{ play: [{ anim: "Create", target: "c" }] }] },
  offframe: { objects: [{ name: "t", type: "Text", params: { text: "This sentence is far too long to fit in the frame", font_size: 60 } },
                        { name: "e", type: "MathTex", params: { tex: "\\color{red} x" } }],
              steps: [{ play: [{ anim: "Write", target: "t" }] }] },
};

async function main() {
  const { tools } = await rpc("tools/list");
  const tool = tools.find((t) => t.name === "ShowAnimation");
  const uri = tool._meta.ui.resourceUri;
  const page = (await rpc("resources/read", { uri })).contents[0];
  const csp = page._meta.ui.csp;
  const src = (csp.resourceDomains || []).join(" ");
  const frames = q.get("noframes") ? "" : (csp.frameDomains || []).join(" ");
  const policy = `default-src 'none'; script-src 'unsafe-inline' ${src}; style-src 'unsafe-inline' ${src}; ` +
    `img-src data: ${src}; font-src ${src}; media-src data:; connect-src ${(csp.connectDomains || []).join(" ")}; ` +
    `frame-src ${frames || "'none'"}`;
  const name = q.get("scene") || "derivative";
  let args = SCENES[name];
  if (!args) {
    const guide = (await rpc("tools/call", { name: "ReadMe", arguments: {} })).content[0].text;
    args = JSON.parse(guide.split("```json")[1].split("```")[0]);
  }
  frame.srcdoc = page.text.replace("<head>", `<head><meta http-equiv="Content-Security-Policy" content="${policy}">`);
  log("resource", uri);
  let initialized;
  const ready = new Promise((r) => (initialized = r));
  const post = (msg) => frame.contentWindow.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const context = () => ({ theme, displayMode: document.body.classList.contains("full") ? "fullscreen" : "inline",
    availableDisplayModes: ["inline", "fullscreen"], platform: "web",
    containerDimensions: document.body.classList.contains("full") ? { width: innerWidth, height: innerHeight }
      : { width: frame.clientWidth, maxHeight: 900 } });
  window.addEventListener("message", (e) => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data;
    window.mcpLog.push(m);
    if (m.method === "ui/initialize") {
      post({ id: m.id, result: { protocolVersion: "2026-01-26", hostInfo: { name: "dev-host", version: "1" },
        hostCapabilities: { openLinks: {} }, hostContext: context() } });
    } else if (m.method === "ui/notifications/initialized") {
      initialized();
    } else if (m.method === "ui/notifications/size-changed") {
      if (!document.body.classList.contains("full")) frame.style.height = `${m.params.height}px`;
    } else if (m.method === "ui/request-display-mode") {
      document.body.classList.toggle("full", m.params.mode === "fullscreen");
      post({ id: m.id, result: { mode: m.params.mode } });
      post({ method: "ui/notifications/host-context-changed", params: context() });
    } else if (m.method === "ui/update-model-context") {
      log("model context:", m.params.content?.[0]?.text);
      post({ id: m.id, result: {} });
    } else if (m.id !== undefined && m.method) {
      post({ id: m.id, error: { code: -32601, message: "not in the dev host" } });
    }
  });
  await ready;
  log("initialized");
  // the chat streams the tool's input as the model writes it, then runs the tool
  // "text" comes first: it streams in word by word, then the scene
  const words = String(args.text || "").split(/(?<=\s)/);
  for (let i = 1; i <= words.length; i += Math.max(1, Math.floor(words.length / 12))) {
    post({ method: "ui/notifications/tool-input-partial", params: { arguments: { text: words.slice(0, i).join("") } } });
    await new Promise((r) => setTimeout(r, 60));
  }
  post({ method: "ui/notifications/tool-input-partial", params: { arguments: { text: args.text, title: args.title, objects: (args.objects || []).slice(0, 2) } } });
  await new Promise((r) => setTimeout(r, Number(q.get("delay") || 600)));
  post({ method: "ui/notifications/tool-input", params: { arguments: args } });
  const result = q.get("result") ? await (await fetch(q.get("result"))).json()
    : await rpc("tools/call", { name: "ShowAnimation", arguments: args });
  log("tool result:", result.content[0].text.slice(0, 300));
  post({ method: "ui/notifications/tool-result", params: result });
  window.hostDone = true;
}
main().catch((e) => { log("ERROR", String(e)); window.hostError = String(e); });
</script>
</body>
</html>
