[project]
name = "manimator"
version = "0.1.0"
description = "Build Manim videos with buttons, in your web browser"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pillow>=10", "pygments>=2.17"]
license = "MIT"

[project.optional-dependencies]
dev = ["manim>=0.19", "pytest", "av", "playwright"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["Test*.py"]  # file names are plain PascalCase: TestWeb.py
filterwarnings = [
    "ignore:\\(rm_rf\\) error removing:pytest.PytestWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
